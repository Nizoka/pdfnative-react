name: CI

# The `ci` job runs `scripts/gate.ts --ci`, the single definition of "green":
# the step list lives in that file's STEPS table (typecheck:all — which
# compiles the frozen 1.2.0 and 1.3.0 compatibility snapshots too —, lint, build,
# dist-check, dist-probe, bundle-smoke, pack-check, test:generate,
# test:coverage, verify:docs, verify:samples, corpus:pdfa, validate:pdfx;
# the publish profile adds validate:pdfa and compat:previous) and is not
# repeated here, so CI and the contributor loop cannot drift apart.
# `--require-all` turns any SKIP into a FAIL: a runner missing a tool goes red
# instead of quietly passing.
#
# `npm audit` runs outside the gate on purpose: the gate is hermetic (no
# network) so its verdict is the same on a laptop and on a runner.
#
# The `dist-probe`, `bundle-smoke` and `pack-check` steps hold the BUILT
# package: the `'use client'` directive on the client entry only, a browser
# bundle of both entries, and the `exports` map resolved the way ESM and CJS
# consumers resolve it (publint, @arethetypeswrong/cli) — source tests import
# src/ directly and cannot catch any of that.
#
# No path filter. Every job here reports a check the ruleset requires, and
# GitHub leaves the checks of a path-filtered workflow pending forever, which
# blocks the pull request: a docs-only change would need the admin bypass,
# and a bypass used weekly stops being an exception. The gate is fast enough
# to run on every pull request, and a docs pull request can still break
# `verify:docs`, which the gate runs (v1.4.0; sample-regression.yml states the
# same rule).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job ids and the matrices are load-bearing: the main ruleset requires the
  # status checks `ci (22)`, `ci (24)`, `os (windows-latest)` and
  # `os (macos-latest)` (.github/rulesets/main.json). Renaming a required
  # check is what leaves every pull request waiting for a context that will
  # never report.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the floor: the pdfnative engine requires it as of 1.6.0.
        node-version: [22, 24]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # 2026-10-31: the npm registry and the setup-node downloads are not baselined yet; block once a month of audit logs names them

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # No lifecycle script of any dependency runs on the runner; the
      # repository's own .npmrc says the same for every developer machine.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Once per commit, not once per platform: the advisory database does not
      # depend on the runner, and four identical network calls are four
      # chances to go red for a reason that is not this repository's. The
      # `os` job below runs no audit.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run the quality gate (CI profile)
        run: npx tsx scripts/gate.ts --ci --require-all

      - name: Upload the gate logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-logs-node${{ matrix.node-version }}
          path: test-output/.gate/
          retention-days: 7
          if-no-files-found: ignore

  # The renderer is consumed on Windows and macOS hosts too — Next.js dev
  # servers, Electron, CI runners — so the same gate runs there, on the pinned
  # Node line: jsdom under `pool: 'forks'`, the child-process sample generator
  # (path rules, the npm.cmd shim), the coverage run, and the sample byte
  # baseline — which is how the "byte-identical on every host" promise is
  # proven on three operating systems rather than asserted on one. Both
  # matrix entries are required status checks (.github/rulesets/main.json).
  #
  # harden-runner runs on every leg, macOS included: the vendor README at the
  # pinned SHA lists GitHub-hosted Windows and macOS runners as supported in
  # audit mode, so one step serves both legs and the policy is the one they
  # allow. Any "skip on this platform" needs a linked issue.
  os:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # 2026-10-31: audit only on Windows/macOS (vendor matrix), and one step serves both legs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The same gate as the Linux matrix; `npm audit` stays on Linux (network,
      # once is enough). The gate builds before the suites that need dist/.
      - name: Run the quality gate (CI profile)
        run: npx tsx scripts/gate.ts --ci --require-all

      - name: Upload the gate logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-logs-${{ matrix.os }}
          path: test-output/.gate/
          retention-days: 7
          if-no-files-found: ignore

  # The zero-breaking-change policy, proven rather than promised (SECURITY.md
  # §Compatibility promise): the previous release's own test suite, exactly as
  # tagged, runs against the current sources.
  # tests/regression/compat/allow-<previous>.json lists the files it may skip,
  # each with a reason and, for a behaviour change, the compatibility-ledger
  # entry of the release note that justifies it. Blocking: a 1.3.0 test that
  # fails on 1.4.0 is a breaking change until the ledger says otherwise.
  compat-previous:
    name: compat-previous
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # 2026-10-31: first runs of the job; block once the npm and GitHub endpoints are baselined

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The previous tag only — anonymously (the repository is public), so the
      # checkout above can keep its credentials off the runner.
      - name: Fetch the previous release tag
        run: |
          TAG=$(node -e "console.log(JSON.parse(require('fs').readFileSync(require('fs').readdirSync('tests/regression/compat').filter(f => /^allow-/.test(f)).map(f => 'tests/regression/compat/' + f).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).pop(), 'utf8')).tag)")
          git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the previous release's test suite against the current sources
        run: npm run compat:previous

  # The workflows themselves are code that holds tokens. zizmor reads them
  # for the GitHub Actions weaknesses (cache poisoning, template injection,
  # excessive permissions, unpinned or impostor actions); actionlint checks
  # the syntax, the expressions and every `run:` script through shellcheck.
  # Both pinned: the zizmor image by the digest the action pins for its
  # version, actionlint by the SHA-256 of its release archive.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # 2026-10-31: the container registry hosts behind ghcr.io are not baselined yet

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          min-severity: medium
          advanced-security: false
          annotations: true

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}" actionlint
          shellcheck --version | head -2
          "${RUNNER_TEMP}/actionlint" -color
