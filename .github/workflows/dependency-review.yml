name: Dependency Review

# Blocks a pull request that introduces a dependency with a known high or
# critical vulnerability, or one under a licence outside the allow-list.
# pdfnative-react has exactly one runtime dependency (react-reconciler;
# pdfnative and react are peers), so this covers the dev toolchain and any
# attempt to add a second runtime one — the project's first hard rule.
#
# Needs the repository's Dependency graph enabled (Settings → Code security).

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed for comment-summary-in-pr.
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit # 2026-10-31: the dependency-review action reaches api.github.com only; block once a run has baselined it

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, Unlicense
          comment-summary-in-pr: on-failure
