name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Trusted Publishing (npmjs.com OIDC):
#   This workflow uses npm Trusted Publishing — no long-lived NPM_TOKEN secret.
#   The OIDC id-token permission mints a short-lived token that:
#     1. Authorises the `npm publish` HTTP request
#     2. Signs the provenance attestation (SLSA Level 2+ via Sigstore)
#   Configure at npmjs.com → package settings → "Configure Trusted Publishing".
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm (OIDC Trusted Publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `id-token: write` mints the OIDC token for Trusted Publishing + provenance.
    # `contents: write` lets the workflow attach the generated SBOM to the release.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing needs npm >= 11.5.1 — that is where the OIDC token
      # exchange landed. Node 22 bundles npm 10.9.x, which has no OIDC support
      # at all: it signs the provenance statement (that uses the GitHub OIDC
      # token directly, via Sigstore), then sends an **unauthenticated** PUT and
      # the registry answers `404 Not Found` rather than 403, because npm does
      # not disclose whether a package exists to an anonymous caller.
      #
      # That 404 is why pinning `node-version` here is a trap: it looks like a
      # policy declaration, but it also selects the npm that does the publish.
      # Upgrading npm explicitly decouples the two, so the Node we support and
      # the npm that can authenticate are no longer the same decision.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Verify npm supports Trusted Publishing
        run: |
          set -euo pipefail
          MAJOR=$(npm --version | cut -d. -f1)
          echo "npm $(npm --version) on node $(node --version)"
          if [ "$MAJOR" -lt 11 ]; then
            echo "::error::npm $(npm --version) cannot use Trusted Publishing (OIDC); npm >= 11.5.1 is required."
            echo "Publishing would fail with a misleading '404 Not Found' after the whole job has run."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src + tests + samples)
        run: npm run typecheck:all

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.cjs
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/index.d.cts
          test -f dist/client.cjs
          test -f dist/client.js
          test -f dist/client.d.ts
          test -f dist/client.d.cts

      # Resolve through the packed tarball and the `exports` map, not by file
      # path. Importing `./dist/index.js` directly proves the file parses; it
      # proves nothing about the `exports` map, so a wrong `types` target or a
      # dropped condition would ship unnoticed. This is the last gate before
      # `npm publish`, so it exercises what a consumer will actually resolve.
      - name: Consumer resolution smoke test
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/pdfnative-react-*.tgz)
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$TARBALL" react react-dom pdfnative

          node -e "
            const root = require('pdfnative-react');
            const client = require('pdfnative-react/client');
            for (const n of ['renderToBytes','renderSpecToBytes','renderToResponse','capabilityManifest','doctor']) {
              if (typeof root[n] !== 'function') throw new Error('CJS root missing ' + n);
            }
            for (const n of ['usePdf','PDFViewer','BlobProvider']) {
              if (typeof client[n] !== 'function') throw new Error('CJS client missing ' + n);
            }
            console.log('CJS ok');
          "
          node --input-type=module -e "
            const [root, client] = await Promise.all([
              import('pdfnative-react'),
              import('pdfnative-react/client'),
            ]);
            for (const n of ['renderToBytes','docSpecSchema','schema','lintDocument']) {
              if (typeof root[n] !== 'function') throw new Error('ESM root missing ' + n);
            }
            if (typeof client.usePdfStream !== 'function') throw new Error('ESM client missing usePdfStream');
            console.log('ESM ok');
          "

          # Render a real PDF from the installed package — proves the postbuild
          # rewrite of the dynamic node:fs/promises import did not corrupt it.
          node --input-type=module -e "
            const { renderSpecToFile } = await import('pdfnative-react');
            const { readFile } = await import('node:fs/promises');
            await renderSpecToFile({ blocks: [['h1','Release smoke test']] }, 'out.pdf');
            const bytes = await readFile('out.pdf');
            if (!bytes.subarray(0, 5).toString('latin1').startsWith('%PDF-')) throw new Error('not a PDF');
            console.log('rendered', bytes.length, 'bytes');
          "

      # PDF/A conformance is a release-blocking property: the corpus (both
      # authoring doors, all four conformance targets, two negative canaries)
      # is validated with the pinned veraPDF reference validator before
      # anything is published. Fail-closed: a broken veraPDF install is an
      # INFRA failure, never a silent skip. Mirrors .github/workflows/verapdf.yml.
      - name: Setup Java (Temurin 17 LTS)
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4.9.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install veraPDF CLI
        env:
          # Same pinned release + installer SHA-256 as verapdf.yml — the
          # archive is executed with `java -jar`, so it is integrity-checked.
          VERAPDF_INSTALL_URL: 'https://software.verapdf.org/rel/1.30/verapdf-greenfield-1.30.2-installer.zip'
          VERAPDF_INSTALL_SHA256: '6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/verapdf-installer"
          curl -fsSL -o "$HOME/verapdf-installer/installer.zip" "${VERAPDF_INSTALL_URL}"
          echo "${VERAPDF_INSTALL_SHA256}  $HOME/verapdf-installer/installer.zip" | sha256sum --check --strict
          unzip -q "$HOME/verapdf-installer/installer.zip" -d "$HOME/verapdf-installer"
          INSTALLER_JAR=$(find "$HOME/verapdf-installer" -name 'verapdf-izpack-installer-*.jar' | head -n1)
          if [ -z "${INSTALLER_JAR}" ]; then
            echo "veraPDF installer jar not found"; exit 1
          fi
          mkdir -p "$HOME/verapdf"
          cat > "$HOME/verapdf/auto-install.xml" <<XML
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir"><installpath>$HOME/verapdf</installpath></com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select"><pack index="0" name="veraPDF GUI" selected="true"/><pack index="1" name="veraPDF Mac and *nix Scripts" selected="true"/><pack index="2" name="veraPDF Documentation" selected="false"/><pack index="3" name="veraPDF Sample Plugins" selected="false"/></com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          XML
          java -jar "${INSTALLER_JAR}" "$HOME/verapdf/auto-install.xml"
          echo "VERAPDF_HOME=$HOME/verapdf" >> "$GITHUB_ENV"
          echo "$HOME/verapdf" >> "$GITHUB_PATH"

      - name: Generate PDF/A corpus
        # dist/ is already built by the Build step above.
        run: npm run corpus:pdfa

      - name: Validate PDF/A corpus (blocking, fail-closed)
        env:
          VERAPDF_REQUIRED: '1'
          VERAPDF_REPORT_DIR: test-output/pdfa/reports
        run: node scripts/validate-pdfa.mjs

      - name: Generate SBOM (CycloneDX)
        # Software Bill of Materials for supply-chain transparency. Uses the
        # CycloneDX generator via npx (build-time only — adds ZERO runtime
        # dependencies to the published package).
        run: npx --yes @cyclonedx/cyclonedx-npm@^1 --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

      # Works for both triggers. Deriving the tag from package.json rather than
      # from `github.event.release` means a `workflow_dispatch` recovery run —
      # the way you republish after a failed release — still attaches the SBOM
      # instead of silently skipping it.
      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" sbom.cdx.json --clobber
          else
            echo "No release $TAG exists yet; the SBOM remains available as a build artifact."
          fi

      - name: Publish (provenance via OIDC)
        run: npm publish --provenance --access public
