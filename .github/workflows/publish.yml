name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Trusted Publishing (npmjs.com OIDC):
#   This workflow uses npm Trusted Publishing — no long-lived NPM_TOKEN secret.
#   The OIDC id-token permission mints a short-lived token that:
#     1. Authorises the `npm publish` HTTP request
#     2. Signs the provenance attestation (SLSA Level 2+ via Sigstore)
#   Configure at npmjs.com → package settings → "Configure Trusted Publishing",
#   bound to this file AND to the `npm-publish` environment below.
#
# Human-in-the-loop: the maintainer creates the GitHub release (the trigger)
# and approves the `npm-publish` environment; nothing here opens or edits a
# release, the attest job only attaches files to one that already exists.
permissions:
  contents: read

# One release at a time, and a running publish is never cancelled half-way.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A protected environment (required reviewer) gates the OIDC token: the
    # job cannot mint one before the maintainer approves the run.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # Audit mode for the first two weeks, then switch to `egress-policy: block`
      # with the endpoints this job actually reaches:
      #   allowed-endpoints: >
      #     api.github.com:443
      #     registry.npmjs.org:443
      #     software.verapdf.org:443
      #     api.adoptium.net:443
      #     fulcio.sigstore.dev:443
      #     rekor.sigstore.dev:443
      #     tuf-repo-cdn.sigstore.dev:443
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The release is built on the Node line .nvmrc names — the same one
          # contributors develop on — not on whatever ">= floor" resolves to.
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read the version and check it against the tag
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "Publishing pdfnative-react ${VERSION} from ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}"

      # Node 22 ships npm 10.9; Trusted Publishing (OIDC, provenance) needs
      # npm ≥ 11.5.1 — with 10.9 the registry answers a misleading 404 after
      # the whole job has run. The client is pinned to one exact release so
      # the bytes that publish are the same on every run — the package itself
      # is still built and tested on the .nvmrc line.
      - name: Install the pinned npm client
        run: |
          set -euo pipefail
          npm install -g npm@11.19.1
          test "$(npm --version)" = "11.19.1"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # PDF/A gate: the release must never publish conformance claims that the
      # reference validator rejects. Same pinned, checksummed veraPDF as
      # verapdf.yml.
      - name: Setup veraPDF
        uses: ./.github/actions/setup-verapdf

      # Every gate step — typecheck, lint, build, the built package's probes,
      # the browser bundle, publint and attw over the exports map, coverage,
      # docs, samples against the baseline chain, the 1.2.0 compatibility
      # check, the conformance corpus through validatePdfX() and veraPDF.
      # --require-all: a missing tool fails the release instead of skipping.
      - name: Run the quality gate (publish profile)
        run: npx tsx scripts/gate.ts --publish --require-all

      - name: Show the package contents
        run: npm pack --dry-run

      # Resolve through the packed tarball and the `exports` map, the way a
      # consumer will: CJS and ESM roots, the /client subpath, and a real
      # render from the installed package. The gate's pack-check proves the
      # map statically (publint, attw); this is the dynamic complement, and
      # the one step that legitimately needs the network (react, react-dom
      # and pdfnative from the registry).
      - name: Consumer resolution smoke test
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          TARBALL=$(ls /tmp/pdfnative-react-*.tgz)
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts "$TARBALL" react react-dom pdfnative

          node -e "
            const root = require('pdfnative-react');
            const client = require('pdfnative-react/client');
            for (const n of ['renderToBytes','renderSpecToBytes','renderToResponse','capabilityManifest','doctor','setDefaultCreationDate']) {
              if (typeof root[n] !== 'function') throw new Error('CJS root missing ' + n);
            }
            for (const n of ['usePdf','PDFViewer','BlobProvider']) {
              if (typeof client[n] !== 'function') throw new Error('CJS client missing ' + n);
            }
            console.log('CJS ok');
          "
          node --input-type=module -e "
            const [root, client] = await Promise.all([
              import('pdfnative-react'),
              import('pdfnative-react/client'),
            ]);
            for (const n of ['renderToBytes','docSpecSchema','schema','lintDocument']) {
              if (typeof root[n] !== 'function') throw new Error('ESM root missing ' + n);
            }
            if (typeof client.usePdfStream !== 'function') throw new Error('ESM client missing usePdfStream');
            console.log('ESM ok');
          "

          # Render a real PDF from the installed package — proves the postbuild
          # rewrite of the dynamic node:fs/promises import did not corrupt it.
          node --input-type=module -e "
            const { renderSpecToFile } = await import('pdfnative-react');
            const { readFile } = await import('node:fs/promises');
            await renderSpecToFile({ blocks: [['h1','Release smoke test']], creationDate: '2026-01-01T00:00:00Z' }, 'out.pdf');
            const bytes = await readFile('out.pdf');
            if (!bytes.subarray(0, 5).toString('latin1').startsWith('%PDF-')) throw new Error('not a PDF');
            console.log('rendered', bytes.length, 'bytes');
          "

      - name: Publish
        run: npm publish --provenance --access public

  # Attests the tarball and a CycloneDX SBOM built from the same commit, and
  # attaches both to the GitHub release when the maintainer has created it.
  attest:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.publish.outputs.version }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # .npmrc sets ignore-scripts, so prepublishOnly does not run for
      # `npm pack`: build explicitly, as the gate did in the publish job.
      - name: Build
        run: npm run build

      # One runtime dependency (react-reconciler) and its tree; pdfnative and
      # react are peers and belong to the consumer's SBOM.
      - name: Generate the SBOM (CycloneDX, runtime dependencies only)
        run: npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > "pdfnative-react-${VERSION}.cdx.json"

      - name: Pack the tarball
        run: |
          set -euo pipefail
          npm pack
          test -f "pdfnative-react-${VERSION}.tgz"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            pdfnative-react-${{ env.VERSION }}.tgz
            pdfnative-react-${{ env.VERSION }}.cdx.json

      # The release is created by the maintainer (human-in-the-loop); on a
      # workflow_dispatch without one, the artefacts stay in the attestation
      # store and nothing is created here.
      - name: Attach the tarball and SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "pdfnative-react-${VERSION}.tgz" "pdfnative-react-${VERSION}.cdx.json" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            echo "::notice::No GitHub release v${VERSION} exists; the tarball and SBOM were attested but not attached."
          fi
